name: Desktop Build (unsigned, personal)

# Why: this fork drops upstream's signed release channels, so this is the
# simplest way to cut installable desktop builds of any branch for personal use.
# No signing, no notarization, no publishing — artifacts land on the run page
# for manual download.
#
# Unsigned builds need a one-time Gatekeeper/SmartScreen override after install:
#   macOS:   xattr -cr /Applications/Orca.app   (or right-click → Open)
#   Windows: SmartScreen "More info" → "Run anyway"
#
# From the Actions tab: pick this workflow, "Run workflow", choose the branch
# and platform. Or from the CLI:
#
#   gh workflow run desktop-build.yml --ref main -f platform=macos

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which installer to build'
        required: true
        default: macos
        type: choice
        options:
          - macos
          - windows
          - linux
          - all

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ inputs.platform }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build-macos:
    if: inputs.platform == 'macos' || inputs.platform == 'all'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-mac-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The repo's own unsigned pipeline, minus build:mac's electron-builder
      # wrapper: on CI that wrapper inherits the config's GitHub publish target
      # and dies for want of a token, so stamp the local version here and call
      # electron-builder with --publish never directly.
      - name: Build macOS dmg + zip
        run: |
          pnpm run build:desktop
          pnpm run build:computer-macos
          pnpm run build:keyboard-layout-macos
          pnpm run build:notification-status-macos
          pnpm run ensure:electron-runtime
          COMMIT="$(git rev-parse --short=12 HEAD)"
          VERSION="$(node -p "require('./package.json').version")-local.$(date +%s).$COMMIT"
          ORCA_BUILD_COMMIT="$COMMIT" ORCA_LOCAL_BUILD_VERSION="$VERSION" \
            pnpm exec electron-builder --config config/electron-builder.config.cjs --mac --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orca-macos
          path: |
            dist/orca-macos-*.dmg
            dist/*-mac.zip
          if-no-files-found: error
          retention-days: 30

  build-windows:
    if: inputs.platform == 'windows' || inputs.platform == 'all'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unsigned NSIS installer; the config's SignPath uninstaller hook falls
      # back to embedding the unsigned uninstaller when its env is absent.
      # --publish never: the config's publish target is upstream's repo.
      - name: Build Windows installer
        run: |
          pnpm run build:desktop
          pnpm run ensure:electron-runtime
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orca-windows
          path: dist/orca-windows-setup.exe
          if-no-files-found: error
          retention-days: 30

  build-linux:
    if: inputs.platform == 'linux' || inputs.platform == 'all'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-builder-linux-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-linux-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux AppImage + deb + rpm
        run: |
          pnpm run build:desktop
          pnpm run ensure:electron-runtime
          pnpm exec electron-builder --config config/electron-builder.config.cjs --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orca-linux
          path: |
            dist/orca-linux*.AppImage
            dist/orca-ide_*.deb
            dist/orca-ide-*.rpm
          if-no-files-found: error
          retention-days: 30

  # Why a separate job: one release per run, published after every requested
  # platform has finished, so the Assets list is complete the moment the
  # release is visible. Tag embeds the run number so re-dispatching never
  # collides with (or clobbers) an existing release.
  publish-release:
    needs: [build-macos, build-windows, build-linux]
    if: >-
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=v${VERSION}-build.${{ github.run_number }}" >>"$GITHUB_OUTPUT"

      - name: Create GitHub release with installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          ls -la dist/
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Orca desktop build $TAG (${{ inputs.platform }})" \
            --notes "Unsigned desktop build of \`$GITHUB_SHA\` ([commit]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)).

          Installers are not code-signed:
          - **macOS**: after mounting the DMG and copying to /Applications, run \`xattr -cr /Applications/Orca.app\` (or right-click → Open on first launch).
          - **Windows**: SmartScreen → More info → Run anyway.

          This build may offer in-app updates from the upstream stablyai/orca releases; accepting one replaces this fork build."
